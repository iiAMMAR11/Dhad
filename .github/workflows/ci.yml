name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ponytail: no npm install — the contract tests are dependency-free node:test files
      - name: Run contract tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated platform tokens are current
        run: python3 scripts/generate_tokens.py --check
