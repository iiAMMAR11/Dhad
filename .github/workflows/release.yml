name: Build packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Test gate: a failing contract test must block the build and the release.
      - name: Run contract tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate platform tokens
        run: python3 scripts/generate_tokens.py --check

      - name: Build two installers
        run: python3 scripts/build_releases.py

      - name: Verify public artifacts
        run: python3 scripts/verify_public_release.py

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.zip
          --notes "ملفا التثبيت الرسميان لـ Dhad."
          --title "Dhad"
