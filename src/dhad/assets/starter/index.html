<!doctype html>
<html lang="ar" dir="rtl" data-dhad-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نقطة بداية ضاد</title>
  <link rel="stylesheet" href="./css/dhad.tokens.css">
  <link rel="stylesheet" href="./css/dhad.core.css">
  <link rel="stylesheet" href="./css/dhad.patterns.css">
</head>
<body class="dhad-app">
  <a class="dhad-skip-link" href="#content">تخطَّ إلى المحتوى</a>
  <main id="content" class="dhad-shell">
    <header class="dhad-page-header">
      <div>
        <p class="dhad-eyebrow">Dhad 3.0</p>
        <h1>هوية مشروعك أولًا</h1>
        <p>نقطة بداية لاختبار العربية والاتجاه والحالات، وليست قالبًا بصريًا ملزمًا.</p>
      </div>
      <button class="dhad-btn dhad-btn--primary" type="button" data-dhad-theme-toggle>تبديل المظهر</button>
    </header>

    <section class="dhad-section" aria-labelledby="sample-title">
      <h2 id="sample-title">مثال اتجاه مختلط</h2>
      <form class="dhad-form" id="sample-form">
        <label class="dhad-field">
          <span class="dhad-field__label">اسم المشروع</span>
          <input class="dhad-input" name="name" value="بوابة العملاء" required>
        </label>
        <label class="dhad-field">
          <span class="dhad-field__label">الرابط</span>
          <input class="dhad-input" name="url" type="url" dir="ltr" value="https://example.com" required>
        </label>
        <button class="dhad-btn dhad-btn--primary" type="submit">حفظ</button>
      </form>
    </section>
  </main>
  <script src="./js/dhad.runtime.js"></script>
  <script>
    document.querySelector("#sample-form").addEventListener("submit", (event) => {
      event.preventDefault();
      if (event.currentTarget.reportValidity()) Dhad.toast("تم الحفظ", "success");
    });
  </script>
</body>
</html>
