<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Plex Arabic";
    src: url("../src/dhad/assets/starter/fonts/IBMPlexSansArabic-Bold.woff2") format("woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "Plex Arabic";
    src: url("../src/dhad/assets/starter/fonts/IBMPlexSansArabic-Regular.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Plex Arabic";
    src: url("../src/dhad/assets/starter/fonts/IBMPlexSansArabic-Medium.woff2") format("woff2");
    font-weight: 500;
  }

  :root {
    --paper: #ffffff;
    --ink: #17181b;
    --muted: #646b76;
    --action: #1557d5;
    --grid: rgba(23, 24, 27, .055);
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    inline-size: 1200px;
    block-size: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 76px;
    background-color: #fbfcfd;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    color: var(--ink);
    font-family: "Plex Arabic", sans-serif;
  }

  .mark {
    inline-size: 300px;
    margin-block-end: 28px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    margin-block-end: 22px;
    padding: 9px 18px;
    border-radius: 10px;
    background: var(--ink);
    color: #fff;
    font-size: 24px;
    font-weight: 500;
  }

  h1 {
    font-size: 100px;
    font-weight: 700;
    line-height: 1.22;
  }

  h1 span { display: block; }
  h1 span:last-child { color: var(--action); }

  .lead {
    max-inline-size: 1000px;
    margin-block-start: 26px;
    color: var(--muted);
    font-size: 29px;
    font-weight: 400;
    line-height: 1.6;
    text-wrap: balance;
  }

  .kinds {
    margin-block-start: 18px;
    color: var(--muted);
    font-size: 24px;
    font-weight: 400;
  }
</style>
</head>
<body>
  <img class="mark" src="../showcase/public/brand-mark.png" alt="ضاد">
  <p class="eyebrow">مهارة للذكاء الاصطناعي · <bdi dir="ltr">AI Skill</bdi></p>
  <h1><span>عملك يستحق</span><span>عربية تليق به.</span></h1>
  <p class="lead">أضِفها إلى <bdi dir="ltr">Claude</bdi> أو <bdi dir="ltr">ChatGPT</bdi>، لتصنع أعمالك بعربية صحيحة واتجاه سليم.</p>
  <p class="kinds">موقع · تطبيق · عرض · PDF · صورة · إعلان</p>
</body>
</html>
